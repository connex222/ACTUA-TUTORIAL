<style>
:root{--bg:#F3F4F8;--surface:#FFFFFF;--ink:#0F1226;--muted:#41465F;--line:#B9BED3;--accent:#2F4858;--teal:#075E5B;--bad:#A3203A;--bad-soft:#F8E6EA;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D19;--surface:#151829;--ink:#F3F4FB;--muted:#BFC3DB;--line:#40456B;--teal:#7FD6D1;--bad:#FF8A9C;--bad-soft:#3A1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0D19;--surface:#151829;--ink:#F3F4FB;--muted:#BFC3DB;--line:#40456B;--teal:#7FD6D1;--bad:#FF8A9C;--bad-soft:#3A1520;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:1.0625rem;line-height:1.55}
.card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(15,18,38,.45)}
.top{height:8px;background:var(--accent)}
.in{padding:1.8rem 1.8rem 1.6rem}
.logo img{height:46px;width:auto;display:block}
.logo .d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .l{display:none}:root:not([data-theme="light"]) .logo .d{display:block}}
:root[data-theme="dark"] .logo .l{display:none}:root[data-theme="dark"] .logo .d{display:block}
.pill{display:inline-flex;align-items:center;gap:.4rem;margin:1.3rem 0 .5rem;font-size:.85rem;font-weight:700;color:var(--teal)}
h1{font-size:1.6rem;line-height:1.2;letter-spacing:-.025em;margin:0 0 .4rem}
p{margin:0 0 1rem;color:var(--muted)}
label{display:block;font-weight:700;font-size:.95rem;margin:1rem 0 .35rem}
.row{display:flex;gap:.5rem}
input{flex:1;min-width:0;font:inherit;min-height:52px;padding:0 .9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #FFC21A;outline-offset:2px}
button{font:inherit;font-weight:700;min-height:52px;border-radius:12px;cursor:pointer}
.show{padding:0 .9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.go{width:100%;margin-top:.8rem;border:0;background:#06524F;color:#FFFFFF}
.go:hover{background:#075E5B}
.err{margin:.8rem 0 0;padding:.6rem .8rem;border-radius:10px;background:var(--bad-soft);color:var(--ink);font-size:.95rem}
.err:empty{display:none}
.back{display:inline-block;margin-top:1.1rem;color:var(--teal);font-weight:700}
.note{font-size:.85rem;margin:1.2rem 0 0}
</style></head><body>
