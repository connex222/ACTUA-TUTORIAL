*{box-sizing:border-box}

p{margin:0 0 1rem;color:var(--muted)}

.row{display:flex;gap:.5rem}
input{flex:1;min-width:0;font:inherit;min-height:52px;padding:0 .9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

button{font:inherit;font-weight:700;min-height:52px;border-radius:12px;cursor:pointer}
.show{padding:0 .9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.go{width:100%;margin-top:.8rem;border:0;background:#06524F;color:#FFFFFF}
.go:hover{background:#075E5B}
.err{margin:.8rem 0 0;padding:.6rem .8rem;border-radius:10px;background:var(--bad-soft);color:var(--ink);font-size:.95rem}
.err:empty{display:none}
.back{display:inline-block;margin-top:1.1rem;color:var(--teal);font-weight:700}
.note{font-size:.85rem;margin:1.2rem 0 0}
